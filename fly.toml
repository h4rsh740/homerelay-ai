# fly.toml app configuration file for HomeRelay AI
app = "homerelay-ai"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  MCP_PORT = "3001"
  MCP_SERVER_URL = "http://127.0.0.1:3001/mcp"
  AI_PROVIDER = "gemini"
  NEXT_PUBLIC_APP_NAME = "HomeRelay AI"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
