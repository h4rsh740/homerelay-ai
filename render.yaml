services:
  - type: web
    name: homerelay-ai
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MCP_PORT
        value: 3001
      - key: MCP_SERVER_SECRET
        generateValue: true
      - key: MCP_SERVER_URL
        value: http://127.0.0.1:3001/mcp
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_NAME
        value: HomeRelay AI
    autoDeploy: true
